<div class="row mx-3 ">
<h2>Crear Item del Inventario</h2><hr>
</div>
<form (submit)="guardarInventario()" [formGroup]="form">
    <div class="row mx-3">
  <div class="col">
    <label for="productoId">Id Producto</label>
    <input [formControl]="form.controls.productoId" type="text" class="form-control" placeholder="Id Producto" aria-label="First name">
  </div>
  <div class="col">
    <label for="productoNombre">Nombre Producto</label>
    <input [formControl]="form.controls.productoNombre" type="text" class="form-control" placeholder="Nombre Producto" aria-label="Last name">
  </div>
  <div class="col">
    <label for="stockDisponible">Stock Disponible</label>
    <input [formControl]="form.controls.stockDisponible" type="number" class="form-control" placeholder="Stock Disponible" aria-label="Last name">
  </div>
  <div class="col">
    <label for="reponerStock">Reponer Stock</label>
    <input [formControl]="form.controls.reponerStock" type="number" class="form-control" placeholder="Reponer Stock" aria-label="Last name">
  </div>
</div>
<div class="mx-5 mt-3">
    <div class="col-lg-3">
        <button type="submit" class="btn btn-primary">Guardar item</button>
    </div>
    <div class="col-lg-3">
        <button class="btn btn-danger">Cancelar</button>
    </div>
</div>
</form>

<div class="div mt-5 mx-3">
  <h3>Detalles de Inventario</h3>
</div>

<div class="row mx-3">
<table class="table table-bordered border-dark mt-2">
  <thead>
    <tr>
      <th scope="col">Id del Producto</th>
      <th scope="col">Nombre del Producto</th>
      <th scope="col">Stock Disponible</th>
      <th scope="col">Reordenar Stock</th>
      <th scope="col">Editar</th>
      <th scope="col">Borrar</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Mobile</td>
      <td>50</td>
      <td>60</td>
      <td>
        <button type="button" class="btn btn-primary">Editar</button>
      </td>
      <td>
        <button type="button" class="btn btn-danger">Borrar</button>
      </td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Laptop</td>
      <td>30</td>
      <td>100</td>
      <td>
        <button type="button" class="btn btn-primary">Editar</button>
      </td>
      <td>
        <button type="button" class="btn btn-danger">Borrar</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
